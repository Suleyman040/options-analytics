# The whole pipeline with one command:   docker compose up -d --build
# Dashboard: http://localhost:8000      API docs: http://localhost:8000/docs
#
# Infrastructure (Kafka, ClickHouse, Postgres) plus the Python services, all
# built from the same image with different commands. Ports are published to
# localhost, so you can also run the Python code from your own terminal against
# these services (see README).

name: options-analytics

x-app: &app
  build: .
  image: options-analytics:latest
  restart: unless-stopped
  environment: &app-env
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    CLICKHOUSE_HOST: clickhouse
    POSTGRES_DSN: postgresql://app:app@postgres:5432/options
    CURRENCY: ${CURRENCY:-BTC}
    MAX_EXPIRIES: ${MAX_EXPIRIES:-4}
    STRIKE_RANGE: ${STRIKE_RANGE:-0.25}
    TICKER_INTERVAL: ${TICKER_INTERVAL:-100ms}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller   # KRaft mode: no ZooKeeper
      # Two client listeners: HOST for code on your machine (localhost:9092),
      # DOCKER for containers on the compose network (kafka:19092).
      KAFKA_LISTENERS: CONTROLLER://localhost:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9091
      # Single broker, so internal topics can only have one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 20s

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    ports:
      - "8123:8123"   # HTTP interface (clickhouse-connect and the Play UI at /play)
    environment:
      CLICKHOUSE_DB: options
      CLICKHOUSE_USER: app
      CLICKHOUSE_PASSWORD: app
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user app --password app --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: options
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d options"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the tables, then exits.
  migrate:
    <<: *app
    command: python -m options_analytics.migrate
    restart: "no"
    depends_on:
      clickhouse: { condition: service_healthy }
      postgres: { condition: service_healthy }

  # Batch job: copies Deribit's option list into Postgres every hour.
  reference:
    <<: *app
    command: python -m options_analytics.reference --every 3600
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Deribit websocket -> Kafka
  ingestor:
    <<: *app
    command: python -m options_analytics.ingestor
    depends_on:
      kafka: { condition: service_healthy }

  # Kafka -> implied vol and Greeks -> ClickHouse
  processor:
    <<: *app
    command: python -m options_analytics.processor
    depends_on:
      kafka: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      reference: { condition: service_started }

  api:
    <<: *app
    command: uvicorn options_analytics.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Optional web UI for browsing Kafka topics and messages:
  #   docker compose --profile tools up -d kafka-ui   ->   http://localhost:8080
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    profiles: ["tools"]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka: { condition: service_healthy }

volumes:
  clickhouse-data:
  postgres-data:
